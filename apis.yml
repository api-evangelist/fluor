description: >-
  Fluor Corporation (NYSE: FLR) is a Fortune 500 engineering, procurement, construction and
  maintenance company headquartered in Irving, Texas. Fluor designs and builds capital projects
  and provides project-management services for energy, chemicals, life sciences, mining and
  metals, advanced technologies, infrastructure and government clients worldwide, and licenses
  its own process technologies such as Econamine FG Plus and Fluor Solvent. Fluor sells
  engineering and construction services rather than software: it operates no developer program,
  publishes no API reference, and serves no machine-readable API contract. Its business-to-business
  integration with suppliers runs inside SAP Ariba and Workday, whose contracts belong to those
  vendors. This is an independent API Evangelist profile of Fluor's public surface.
